# Dependabot: keep the workflow actions and the Python dev dependencies current.
# The project has no runtime dependencies, so this is deliberately low-frequency.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    groups:
      python-dev-dependencies:
        patterns: ["*"]
