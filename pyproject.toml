[project]
name = "ra2web-jev-player"
version = "0.2.0"
description = "Self-contained bot that plays single-player skirmish matches in the browser game Chrono Divide (web Red Alert 2) using the game's official player API and a semantic decision model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["red-alert-2", "chrono-divide", "game-bot", "browser-automation", "typesafe", "jev", "llm-agent", "reinforcement-learning"]
authors = [{ name = "ys118", email = "156525277@qq.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Real Time Strategy",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ys118/ra2web-jev-player"
Repository = "https://github.com/ys118/ra2web-jev-player"
Issues = "https://github.com/ys118/ra2web-jev-player/issues"
Changelog = "https://github.com/ys118/ra2web-jev-player/blob/master/CHANGELOG.md"
Documentation = "https://github.com/ys118/ra2web-jev-player/blob/master/docs/README.md"

[project.scripts]
ra2web-jev-play = "ra2web_jev_player.cli:main_play"
ra2web-jev-launch = "ra2web_jev_player.cli:main_launch"
ra2web-jev-attach = "ra2web_jev_player.cli:main_attach"
ra2web-jev-review = "ra2web_jev_player.cli:main_review"

[dependency-groups]
# The default path needs only the standard library; dependencies are grouped by use
# (install with `uv sync --group <name>`).
# research: historical crawler/extraction scripts under references/research/
research = ["requests>=2.31"]
# dev: tests and static checks (`uv run pytest` / `uv run ruff check`)
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

# uv's cache (C:) and the project (D:) are on different drives, so hardlinks are
# unavailable; pin copy mode to silence the warning.
[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Stale assertions in tests/regression are marked xfail (see tests/README.md)
xfail_strict = false

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]
# Reference material and the historical archive are not linted
# (one-off crawler scripts, the match-1..20 legacy loop).
extend-exclude = ["references", "src/ra2web_jev_player/legacy", "artifacts"]

[tool.ruff.lint]
# Deliberately small rule set: real bugs only (syntax-level errors, undefined
# names, unused imports/variables, import order). Style rules are off because the
# code carries dense per-match annotations that would drown the signal.
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E402",   # scenario/tool scripts must sys.path.insert before importing
]

[tool.ruff.lint.per-file-ignores]
# Regression scenario scripts: the file is the test case (top-level execution,
# compact style); keep only rules that would actually break them.
"tests/regression/*" = ["F401", "F841", "E741", "E401", "E701", "E702", "I001"]
